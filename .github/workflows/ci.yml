name: .NET CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore PhoneStore.slnx

    - name: Build Solution
      run: dotnet build PhoneStore.slnx --no-restore --configuration Release

    - name: Run Architecture & Unit Tests
      run: dotnet test PhoneStore.slnx --no-build --configuration Release --verbosity normal
