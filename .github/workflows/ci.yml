name: .NET CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    # Không giới hạn branch để các PR stack trên nhánh feature (vd. PR #2 base
    # là feature/N2LHTBLTT-12-cart-order-entities) vẫn chạy CI.
    branches: [ '**' ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # N2LHTBLTT-39: PhoneStore.IntegrationTests cần PostgreSQL thật để chạy E2E
    # qua HTTP thật (WebApplicationFactory + PostgreSQL). Không có service này
    # thì toàn bộ integration test chết vì lỗi kết nối Npgsql.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Connection string quản trị để tạo/xoá database test riêng.
      # Trong CI PostgreSQL chạy ở port chuẩn 5432 (khác với local dùng 5433).
      PHONESTORE_TEST_ADMIN_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: '**/*.csproj'

    - name: Restore dependencies
      run: dotnet restore PhoneStore.slnx

    - name: Build Solution
      run: dotnet build PhoneStore.slnx --no-restore --configuration Release

    - name: Run Unit & Architecture Tests
      run: >-
        dotnet test
        tests/PhoneStore.UnitTests/PhoneStore.UnitTests.csproj
        --no-build --configuration Release
        --logger "console;verbosity=normal"

    - name: Run Architecture Tests
      run: >-
        dotnet test
        tests/PhoneStore.ArchitectureTests/PhoneStore.ArchitectureTests.csproj
        --no-build --configuration Release
        --logger "console;verbosity=normal"

    - name: Run Integration Tests (E2E + PostgreSQL)
      run: >-
        dotnet test
        tests/PhoneStore.IntegrationTests/PhoneStore.IntegrationTests.csproj
        --no-build --configuration Release
        --logger "console;verbosity=normal"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/TestResults/**'
        if-no-files-found: ignore
