# Các location dùng chung cho server :80 và :443 (include trong server block).
    # Ảnh upload lưu trên MinIO (bucket phonestore-images, public read). `^~` để thắng
    # location regex ảnh tĩnh bên dưới. Giữ Host gốc để presigned URL (ký theo domain public) hợp lệ.
    location ^~ /phonestore-images/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $phonestore_fwd_proto;
        proxy_set_header Connection "";
        limit_except GET HEAD { deny all; }
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/phonestore-headers.conf;
    }

    # Asset tĩnh: cache dài, có fingerprint theo tên file.
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        proxy_pass http://phonestore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $phonestore_fwd_proto;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/phonestore-headers.conf;
    }

    # HTML (SPA shell): không cache để deploy mới được nhận ngay.
    location ~* \.html$ {
        proxy_pass http://phonestore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $phonestore_fwd_proto;
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/phonestore-headers.conf;
    }

    # Chặn file ẩn (.env, .git, ...) — trừ .well-known.
    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }

    # Đăng nhập / đăng ký: giới hạn chặt chống dò mật khẩu (10 lần/phút/IP, cho dồn 10).
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=ps_auth burst=10 nodelay;
        proxy_pass http://phonestore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $phonestore_fwd_proto;
        proxy_set_header Connection "";
    }

    # API: không cache, luôn chuyển tiếp header cho reverse proxy chain.
    location /api/ {
        limit_req zone=ps_api burst=60 nodelay;
        proxy_pass http://phonestore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $phonestore_fwd_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Swagger (chỉ nên bật ở staging/demo).
    location /swagger/ {
        proxy_pass http://phonestore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $phonestore_fwd_proto;
    }

    # Health check không đi qua proxy để monitor được trực tiếp.
    location = /health {
        proxy_pass http://phonestore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $phonestore_fwd_proto;
        access_log off;
    }

    # Storefront SPA (index.html + fallback route).
    location / {
        proxy_pass http://phonestore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $phonestore_fwd_proto;
        proxy_set_header Connection "";
    }
