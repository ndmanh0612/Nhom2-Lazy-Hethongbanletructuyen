# ==============================================================================
# PhoneStore — Production stack (API + PostgreSQL + nginx reverse proxy)
#
# Chạy:
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.prod up -d --build
#
# Truy cập:
#   http://localhost            → storefront (SPA)
#   http://localhost/health     → health check
#   http://localhost/swagger    → Swagger UI (bật trong Production)
# ==============================================================================

name: phonestore

services:
  postgres:
    image: postgres:16-alpine
    container_name: phonestore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-phonestore_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-phonestore_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - phonestore-net

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: phonestore-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-phonestore_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      # Khoá ký JWT bắt buộc ở Production (>= 32 ký tự), lấy từ file .env.prod.
      Authentication__SigningKey: ${PHONESTORE_SIGNING_KEY:?Thiếu PHONESTORE_SIGNING_KEY trong file .env.prod}
      Authentication__AllowDevelopmentSigningKey: "false"
      Authentication__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-60}
      Authentication__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-7}
      Database__AutoMigrate: "true"
      Database__AutoSeed: "true"
      Database__AutoSeedSample: "true"
      Swagger__Enabled: "true"
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:-http://localhost}
      # Lưu ảnh upload trên MinIO (N2LHTBLTT-30/31). Ảnh public qua nginx: <PUBLIC_ORIGIN>/phonestore-images/...
      MinioStorage__Endpoint: http://minio:9000
      MinioStorage__AccessKey: ${MINIO_ROOT_USER:?Thiếu MINIO_ROOT_USER trong file env.prod}
      MinioStorage__SecretKey: ${MINIO_ROOT_PASSWORD:?Thiếu MINIO_ROOT_PASSWORD trong file env.prod}
      MinioStorage__BucketName: phonestore-images
      MinioStorage__PublicBaseUrl: ${PUBLIC_ORIGIN:-http://localhost}
    expose:
      - "8080"
    networks:
      - phonestore-net

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    container_name: phonestore-web
    restart: unless-stopped
    depends_on:
      - api
      - minio
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_SSL_PORT:-443}:443"
    volumes:
      # NGINX_CONF=nginx.ssl.conf để bật HTTPS (xem docs/DEPLOY.md mục 9).
      - ./${NGINX_CONF:-nginx.conf}:/etc/nginx/conf.d/phonestore.conf:ro
      - ../certbot-www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - phonestore-net

  # MinIO (S3-compatible): lưu ảnh sản phẩm admin upload. Chỉ chạy trong mạng nội bộ Docker,
  # không mở cổng ra ngoài; nginx chuyển tiếp /phonestore-images/ để trình duyệt tải ảnh.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: phonestore-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Thiếu MINIO_ROOT_USER trong file env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Thiếu MINIO_ROOT_PASSWORD trong file env.prod}
    volumes:
      - miniodata:/data
    expose:
      - "9000"
    networks:
      - phonestore-net

  # Cloudflare Tunnel (tuỳ chọn): đưa web ra Internet qua Cloudflare, không cần mở cổng 80/443.
  # Chạy kèm: --profile cloudflare  (cần CLOUDFLARE_TUNNEL_TOKEN, xem docs/DEPLOY.md mục 10).
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: phonestore-cloudflared
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate --url http://web:80 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    networks:
      - phonestore-net

  # Quick tunnel (demo nhanh, không cần tài khoản): URL ngẫu nhiên *.trycloudflare.com in trong log.
  # Chạy kèm: --profile cloudflare-quick
  cloudflared-quick:
    image: cloudflare/cloudflared:2024.12.2
    container_name: phonestore-cloudflared-quick
    restart: unless-stopped
    profiles: ["cloudflare-quick"]
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web
    networks:
      - phonestore-net

volumes:
  pgdata:
  miniodata:

networks:
  phonestore-net:
    driver: bridge
