# ==============================================================================
# PhoneStore — Production stack (API + PostgreSQL + nginx reverse proxy)
#
# Chạy:
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.prod up -d --build
#
# Truy cập:
#   http://localhost            → storefront (SPA)
#   http://localhost/health     → health check
#   http://localhost/swagger    → Swagger UI (bật trong Production)
# ==============================================================================

name: phonestore

services:
  postgres:
    image: postgres:16-alpine
    container_name: phonestore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-phonestore_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-phonestore_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - phonestore-net

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: phonestore-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-phonestore_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      # Khoá ký JWT bắt buộc ở Production (>= 32 ký tự), lấy từ file .env.prod.
      Authentication__SigningKey: ${PHONESTORE_SIGNING_KEY:?Thiếu PHONESTORE_SIGNING_KEY trong file .env.prod}
      Authentication__AllowDevelopmentSigningKey: "false"
      Authentication__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-60}
      Authentication__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-7}
      Database__AutoMigrate: "true"
      Database__AutoSeed: "true"
      Swagger__Enabled: "true"
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:-http://localhost}
    expose:
      - "8080"
    networks:
      - phonestore-net

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    container_name: phonestore-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_SSL_PORT:-443}:443"
    volumes:
      # NGINX_CONF=nginx.ssl.conf để bật HTTPS (xem docs/DEPLOY.md mục 9).
      - ./${NGINX_CONF:-nginx.conf}:/etc/nginx/conf.d/phonestore.conf:ro
      - ../certbot-www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - phonestore-net

volumes:
  pgdata:

networks:
  phonestore-net:
    driver: bridge
