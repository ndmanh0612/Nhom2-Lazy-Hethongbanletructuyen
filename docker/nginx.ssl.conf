# ==============================================================================
# PhoneStore — Reverse proxy cho môi trường production
# Đóng vai trò single entry point: TLS termination, nén gzip, cache tĩnh và
# chuyển tiếp /api tới container API.
# ==============================================================================

# Khi đi qua Cloudflare Tunnel, cloudflared gọi nginx bằng HTTP nhưng gửi kèm
# X-Forwarded-Proto: https — giữ giá trị đó để API đặt cookie Secure đúng.
include /etc/nginx/snippets/phonestore-http.conf;

map $http_x_forwarded_proto $phonestore_fwd_proto {
    default $scheme;
    https   https;
}

upstream phonestore_api {
    server api:8080;
    keepalive 32;
}

# HTTP: chỉ phục vụ xác thực chứng chỉ, còn lại chuyển sang HTTPS.
server {
    listen 80;
    server_name phonestore.lazi.id.vn _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        proxy_pass http://phonestore_api;
        access_log off;
    }

    location / {
        return 301 https://phonestore.lazi.id.vn$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name phonestore.lazi.id.vn;

    ssl_certificate     /etc/letsencrypt/live/phonestore.lazi.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phonestore.lazi.id.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 8m;  # upload ảnh tối đa 5MB + overhead multipart

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Chỉ nhận traffic đi qua Cloudflare: truy cập thẳng IP server bị đóng kết nối (444).
    # Nếu tắt proxy Cloudflare (mây xám) thì phải bỏ dòng này.
    if ($ps_from_cloudflare = 0) { return 444; }

    include /etc/nginx/snippets/phonestore-headers.conf;
    limit_conn ps_conn 50;

    include /etc/nginx/snippets/phonestore-locations.conf;
}
