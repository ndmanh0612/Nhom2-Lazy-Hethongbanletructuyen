# ==============================================================================
# PhoneStore — Reverse proxy cho môi trường production
# Đóng vai trò single entry point: TLS termination, nén gzip, cache tĩnh và
# chuyển tiếp /api tới container API.
# ==============================================================================

upstream phonestore_api {
    server api:8080;
    keepalive 32;
}

# HTTP: chỉ phục vụ xác thực chứng chỉ, còn lại chuyển sang HTTPS.
server {
    listen 80;
    server_name phonestore.lazi.id.vn _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        proxy_pass http://phonestore_api;
        access_log off;
    }

    location / {
        return 301 https://phonestore.lazi.id.vn$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name phonestore.lazi.id.vn;

    ssl_certificate     /etc/letsencrypt/live/phonestore.lazi.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phonestore.lazi.id.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 4m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/phonestore-locations.conf;
}
