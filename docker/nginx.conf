# ==============================================================================
# PhoneStore — Reverse proxy cho môi trường production
# Đóng vai trò single entry point: TLS termination, nén gzip, cache tĩnh và
# chuyển tiếp /api tới container API.
# ==============================================================================

upstream phonestore_api {
    server api:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Giới hạn kích thước request body (JSON thông thường rất nhỏ).
    client_max_body_size 4m;

    # Nén gzip cho phản hồi text.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Header bảo mật cơ bản.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Asset tĩnh: cache dài, có fingerprint theo tên file.
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        proxy_pass http://phonestore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML (SPA shell): không cache để deploy mới được nhận ngay.
    location ~* \.html$ {
        proxy_pass http://phonestore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # API: không cache, luôn chuyển tiếp header cho reverse proxy chain.
    location /api/ {
        proxy_pass http://phonestore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Swagger (chỉ nên bật ở staging/demo).
    location /swagger/ {
        proxy_pass http://phonestore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check không đi qua proxy để monitor được trực tiếp.
    location = /health {
        proxy_pass http://phonestore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Storefront SPA (index.html + fallback route).
    location / {
        proxy_pass http://phonestore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
