# ==============================================================================
# PhoneStore — Reverse proxy cho môi trường production
# Đóng vai trò single entry point: TLS termination, nén gzip, cache tĩnh và
# chuyển tiếp /api tới container API.
# ==============================================================================

upstream phonestore_api {
    server api:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name phonestore.lazi.id.vn _;

    # Đường xác thực Let's Encrypt (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 4m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/phonestore-locations.conf;
}
