<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Shadow filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#10b981" flood-opacity="0.25" />
    </filter>
    
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Canvas Background with border -->
  <rect x="15" y="15" width="1070" height="750" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Title & Header -->
  <text x="550" y="52" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.3">
    CƠ CHẾ XỬ LÝ IDEMPOTENCY VỚI REQUEST_KEY VÀ REQUEST_HASH
  </text>
  <text x="550" y="74" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">
    Mô hình kiến trúc chống tạo đơn trùng lặp và kiểm soát toàn vẹn dữ liệu giao dịch
  </text>

  <!-- 1. CLIENT NODE -->
  <g transform="translate(425, 95)" filter="url(#cardShadow)">
    <rect width="250" height="52" rx="10" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" />
    <text x="125" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">
      Client (Web / Mobile App)
    </text>
    <text x="125" y="42" text-anchor="middle" font-size="11" fill="#e0f2fe">
      Sinh UUID làm X-Request-Key
    </text>
  </g>

  <!-- Arrow Client -> Middleware -->
  <path d="M 550 147 L 550 188" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)" fill="none" />
  <rect x="430" y="156" width="240" height="22" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
  <text x="550" y="171" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0369a1">
    POST /orders (request_key + JSON Body)
  </text>

  <!-- 2. IDEMPOTENCY MIDDLEWARE -->
  <g transform="translate(385, 195)" filter="url(#cardShadow)">
    <rect width="330" height="56" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
    <text x="165" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">
      Idempotency Middleware
    </text>
    <text x="165" y="43" text-anchor="middle" font-size="11" fill="#475569">
      Đọc Header 'X-Request-Key' &amp; Tra cứu Cache / Database
    </text>
  </g>

  <!-- Split paths down to branches -->
  <path d="M 550 251 L 550 280" stroke="#64748b" stroke-width="2" fill="none" />
  
  <!-- Horizontal splitter -->
  <path d="M 285 280 L 815 280" stroke="#64748b" stroke-width="2" fill="none" />
  
  <!-- Left path down -->
  <path d="M 285 280 L 285 315" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" fill="none" />
  <!-- Right path down -->
  <path d="M 815 280 L 815 315" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)" fill="none" />

  <!-- Label Left Split -->
  <rect x="180" y="270" width="140" height="20" rx="5" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="250" y="284" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">Chưa có Key (Lần đầu)</text>

  <!-- Label Right Split -->
  <rect x="750" y="270" width="140" height="20" rx="5" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
  <text x="820" y="284" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">Đã có Key (Lần gửi lại)</text>


  <!-- ========================================== -->
  <!-- BRANCH 1: FIRST TIME (CHƯA CÓ KEY) - LEFT -->
  <!-- ========================================== -->
  <g transform="translate(45, 320)" filter="url(#cardShadow)">
    <!-- Container Card -->
    <rect width="480" height="420" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="1.8" />
    
    <!-- Card Header -->
    <rect width="480" height="42" rx="14" fill="#ecfdf5" />
    <path d="M 0 28 L 0 42 L 480 42 L 480 28 Z" fill="#ecfdf5" />
    <line x1="0" y1="42" x2="480" y2="42" stroke="#a7f3d0" stroke-width="1" />
    <text x="240" y="27" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">
      LẦN ĐẦU TIÊN: CHƯA TỒN TẠI KEY TRONG HỆ THỐNG
    </text>

    <!-- Step 1 -->
    <g transform="translate(30, 58)">
      <rect width="420" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="28" cy="26" r="14" fill="#059669" />
      <text x="28" y="31" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
      <text x="56" y="23" font-size="12.5" font-weight="700" fill="#0f172a">Tính toán chuỗi băm request_hash</text>
      <text x="56" y="40" font-size="11" fill="#475569">request_hash = SHA256(Raw JSON Body)</text>
    </g>
    <path d="M 240 110 L 240 126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

    <!-- Step 2 -->
    <g transform="translate(30, 128)">
      <rect width="420" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="28" cy="26" r="14" fill="#059669" />
      <text x="28" y="31" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
      <text x="56" y="23" font-size="12.5" font-weight="700" fill="#0f172a">Khóa tạm và lưu trạng thái xử lý</text>
      <text x="56" y="40" font-size="11" fill="#475569">Lưu DB/Redis: (Key, Hash, Status = 'PROCESSING')</text>
    </g>
    <path d="M 240 180 L 240 196" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

    <!-- Step 3 -->
    <g transform="translate(30, 198)">
      <rect width="420" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="28" cy="26" r="14" fill="#059669" />
      <text x="28" y="31" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
      <text x="56" y="23" font-size="12.5" font-weight="700" fill="#0f172a">Thực thi nghiệp vụ trong Controller/Service</text>
      <text x="56" y="40" font-size="11" fill="#475569">Tạo đơn hàng, khóa tồn kho (SELECT FOR UPDATE)</text>
    </g>
    <path d="M 240 250 L 240 266" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

    <!-- Step 4 -->
    <g transform="translate(30, 268)">
      <rect width="420" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="28" cy="26" r="14" fill="#059669" />
      <text x="28" y="31" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
      <text x="56" y="23" font-size="12.5" font-weight="700" fill="#0f172a">Cập nhật hoàn tất và lưu Response</text>
      <text x="56" y="40" font-size="11" fill="#475569">Status = 'COMPLETED', lưu Response Body vào Cache</text>
    </g>
    <path d="M 240 320 L 240 338" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" fill="none" />

    <!-- Step 5 (Result 201) -->
    <g transform="translate(30, 342)" filter="url(#glowGreen)">
      <rect width="420" height="56" rx="10" fill="#059669" />
      <text x="210" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">
        Trả về kết quả: HTTP 201 Created
      </text>
      <text x="210" y="44" text-anchor="middle" font-size="11.5" fill="#d1fae5">
        Đơn hàng được khởi tạo thành công lần đầu
      </text>
    </g>
  </g>


  <!-- ========================================== -->
  <!-- BRANCH 2: RETRY (ĐÃ CÓ KEY TRƯỚC ĐÓ) - RIGHT -->
  <!-- ========================================== -->
  <g transform="translate(575, 320)" filter="url(#cardShadow)">
    <!-- Container Card -->
    <rect width="480" height="420" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8" />
    
    <!-- Card Header -->
    <rect width="480" height="42" rx="14" fill="#f5f3ff" />
    <path d="M 0 28 L 0 42 L 480 42 L 480 28 Z" fill="#f5f3ff" />
    <line x1="0" y1="42" x2="480" y2="42" stroke="#ddd6fe" stroke-width="1" />
    <text x="240" y="27" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5b21b6">
      LẦN GỬI LẠI: ĐÃ CÓ KEY (RETRY DO RỚT MẠNG HOẶC DOUBLE-CLICK)
    </text>

    <!-- Compare Step -->
    <g transform="translate(30, 58)">
      <rect width="420" height="58" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1.2" />
      <text x="210" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#581c87">
        So sánh request_hash mới với request_hash đã lưu
      </text>
      <text x="210" y="44" text-anchor="middle" font-size="11" fill="#6b21a8">
        Kiểm tra tính toàn vẹn của nội dung yêu cầu (Payload Integrity)
      </text>
    </g>

    <!-- Branch from compare: Left (Mismatch) & Right (Match) -->
    <!-- Down connectors -->
    <path d="M 130 116 L 130 148" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)" fill="none" />
    <path d="M 350 116 L 350 148" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowGreen)" fill="none" />

    <!-- CASE A: HASH KHÁC NHAU (LỖI GIAN LẬN / PAYLOAD BỊ SỬA) -->
    <g transform="translate(20, 150)">
      <rect width="210" height="248" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" />
      
      <!-- Label -->
      <rect x="15" y="12" width="180" height="24" rx="5" fill="#ffe4e6" />
      <text x="105" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#be123c">
        HASH KHÁC NHAU
      </text>

      <text x="15" y="58" font-size="11.5" font-weight="600" fill="#881337">Nguyên nhân:</text>
      <text x="15" y="76" font-size="10.5" fill="#9f1239">• Cùng request_key</text>
      <text x="15" y="94" font-size="10.5" fill="#9f1239">• Nhưng sửa Body JSON</text>
      <text x="15" y="112" font-size="10.5" fill="#9f1239">• Nghi vấn gian lận/lỗi</text>

      <line x1="15" y1="126" x2="195" y2="126" stroke="#fecdd3" stroke-width="1" />

      <text x="15" y="146" font-size="11.5" font-weight="600" fill="#881337">Hành động của Server:</text>
      <text x="15" y="166" font-size="10.5" fill="#9f1239">• Chặn đứng ngay lập tức</text>
      <text x="15" y="184" font-size="10.5" fill="#9f1239">• Không sửa đổi DB</text>

      <!-- Badge 409 -->
      <rect x="15" y="200" width="180" height="36" rx="8" fill="#e11d48" />
      <text x="105" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">
        409 Conflict (Báo lỗi)
      </text>
    </g>

    <!-- CASE B: HASH TRÙNG NHAU (GỬI LẠI HỢP LỆ) -->
    <g transform="translate(250, 150)">
      <rect width="210" height="248" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
      
      <!-- Label -->
      <rect x="15" y="12" width="180" height="24" rx="5" fill="#d1fae5" />
      <text x="105" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">
        HASH TRÙNG NHAU
      </text>

      <text x="15" y="58" font-size="11.5" font-weight="600" fill="#065f46">Nguyên nhân:</text>
      <text x="15" y="76" font-size="10.5" fill="#047857">• Khách ấn đúp (double-click)</text>
      <text x="15" y="94" font-size="10.5" fill="#047857">• Mạng lag, Client gửi lại</text>
      <text x="15" y="112" font-size="10.5" fill="#047857">• Đúng cùng 1 hành động</text>

      <line x1="15" y1="126" x2="195" y2="126" stroke="#a7f3d0" stroke-width="1" />

      <text x="15" y="146" font-size="11.5" font-weight="600" fill="#065f46">Hành động của Server:</text>
      <text x="15" y="166" font-size="10.5" fill="#047857">• Bỏ qua tạo đơn / trừ tiền</text>
      <text x="15" y="184" font-size="10.5" fill="#047857">• Lấy Response đã lưu</text>

      <!-- Badge 200/Cached -->
      <rect x="15" y="200" width="180" height="36" rx="8" fill="#059669" />
      <text x="105" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">
        Trả Response Cũ (Thành công)
      </text>
    </g>
  </g>

</svg>
