<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- Border & Background -->
  <rect x="15" y="15" width="1170" height="730" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Main Header -->
  <text x="600" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">
    MÔ HÌNH HÓA 2 CƠ CHẾ GIAO TIẾP LIÊN MODULE VÀ ĐIỀU PHỐI GIAO DỊCH (ACID)
  </text>
  <text x="600" y="70" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">
    Hệ thống PhoneStore Backend - Kiến trúc Modular Monolith &amp; Clean Architecture
  </text>

  <!-- =================================================== -->
  <!-- LEFT PANEL: CƠ CHẾ 1 - ĐỒNG BỘ & TRANSACTIONSCOPE  -->
  <!-- =================================================== -->
  <g transform="translate(35, 95)" filter="url(#shadow)">
    <!-- Container -->
    <rect width="680" height="625" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    
    <!-- Header -->
    <rect width="680" height="42" rx="14" fill="#f0f9ff" />
    <path d="M 0 26 L 0 42 L 680 42 L 680 26 Z" fill="#f0f9ff" />
    <line x1="0" y1="42" x2="680" y2="42" stroke="#bae6fd" stroke-width="1" />
    <text x="340" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">
      CƠ CHẾ 1: GIAO TIẾP ĐỒNG BỘ QUA SERVICE CONTRACTS
    </text>

    <!-- Caller Node -->
    <g transform="translate(215, 55)">
      <rect width="250" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
      <text x="125" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">Module Order</text>
      <text x="125" y="40" text-anchor="middle" font-size="11" fill="#075985">OrderService.CheckoutAsync</text>
    </g>

    <!-- Arrows from Caller down to Contracts -->
    <path d="M 340 105 L 130 140" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrowBlue)" fill="none" />
    <path d="M 340 105 L 340 140" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrowBlue)" fill="none" />
    <path d="M 340 105 L 550 140" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrowBlue)" fill="none" />

    <!-- Layer Contracts in BuildingBlocks -->
    <g transform="translate(20, 145)">
      <rect width="640" height="75" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" />
      <text x="320" y="20" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">
        TẦNG DÙNG CHUNG: BUILDINGBLOCKS CONTRACTS (ÁP DỤNG DEPENDENCY INVERSION)
      </text>

      <!-- Contract 1 -->
      <rect x="20" y="30" width="180" height="34" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
      <text x="110" y="52" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0369a1">ICartContract</text>

      <!-- Contract 2 -->
      <rect x="230" y="30" width="180" height="34" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
      <text x="320" y="52" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0369a1">IProductPricingContract</text>

      <!-- Contract 3 -->
      <rect x="440" y="30" width="180" height="34" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
      <text x="530" y="52" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0369a1">IInventoryContract</text>
    </g>

    <!-- TRANSACTIONSCOPE CONTAINER (ACID) -->
    <g transform="translate(20, 235)">
      <rect width="640" height="235" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" />
      <rect x="15" y="10" width="360" height="24" rx="6" fill="#fef3c7" />
      <text x="195" y="27" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">
        TRANSACTIONSCOPE: ĐIỀU PHỐI GIAO DỊCH NGUYÊN TỬ (ACID)
      </text>

      <!-- Step 1: Order DB -->
      <g transform="translate(20, 48)">
        <rect width="180" height="85" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2" />
        <text x="90" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">1. Ghi Order Mới</text>
        <text x="90" y="42" text-anchor="middle" font-size="10.5" fill="#475569">Schema: ordering</text>
        <text x="90" y="60" text-anchor="middle" font-size="10" fill="#64748b">Lưu Snapshot giá</text>
        <text x="90" y="74" text-anchor="middle" font-size="10" fill="#64748b">&amp; CartId nguồn</text>
      </g>

      <!-- Step 2: Inventory DB -->
      <g transform="translate(230, 48)">
        <rect width="180" height="85" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5" />
        <text x="90" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">2. Đặt Giữ Kho</text>
        <text x="90" y="42" text-anchor="middle" font-size="10.5" fill="#475569">Schema: inventory</text>
        <text x="90" y="60" text-anchor="middle" font-size="10" font-weight="600" fill="#b45309">SELECT FOR UPDATE</text>
        <text x="90" y="74" text-anchor="middle" font-size="10" fill="#64748b">Khóa dòng chống bán âm</text>
      </g>

      <!-- Step 3: Cart DB -->
      <g transform="translate(440, 48)">
        <rect width="180" height="85" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2" />
        <text x="90" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">3. Chuyển Trạng Thái</text>
        <text x="90" y="42" text-anchor="middle" font-size="10.5" fill="#475569">Schema: cart</text>
        <text x="90" y="60" text-anchor="middle" font-size="10" fill="#64748b">MarkAsConvertedAsync</text>
        <text x="90" y="74" text-anchor="middle" font-size="10" fill="#64748b">Giỏ -> CONVERTED</text>
      </g>

      <!-- Decision Bar -->
      <g transform="translate(20, 150)">
        <rect width="600" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        
        <!-- Fail case -->
        <g transform="translate(15, 10)">
          <rect width="275" height="50" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1" />
          <text x="137" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#be123c">KHO THIẾU HÀNG / LỖI</text>
          <text x="137" y="38" text-anchor="middle" font-size="10" fill="#9f1239">Tự động ROLLBACK toàn bộ 3 Schema</text>
        </g>

        <!-- Success case -->
        <g transform="translate(310, 10)">
          <rect width="275" height="50" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
          <text x="137" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">ĐỦ KHO &amp; GHI THÀNH CÔNG</text>
          <text x="137" y="38" text-anchor="middle" font-size="10" fill="#047857">TransactionScope.Complete() (Cam kết)</text>
        </g>
      </g>
    </g>

    <!-- Footer Summary of Mech 1 -->
    <g transform="translate(20, 485)">
      <rect width="640" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="20" y="25" font-size="12" font-weight="700" fill="#0f172a">Đặc điểm kỹ thuật chính của Cơ chế 1:</text>
      <text x="20" y="47" font-size="11" fill="#334155">• Hình thức: Gọi trực tiếp trong cùng tiến trình (In-process Direct Call), đồng bộ.</text>
      <text x="20" y="67" font-size="11" fill="#334155">• Mục đích: Lấy dữ liệu ngay (Snapshot giá) hoặc xác thực điều kiện bắt buộc trước khi tạo đơn.</text>
      <text x="20" y="87" font-size="11" fill="#334155">• Bảo đảm an toàn: Bọc trong TransactionScope đảm bảo quy tắc ACID (Thành công cùng nhau hoặc hủy sạch).</text>
      <text x="20" y="107" font-size="11" fill="#334155">• Tính cô lập: Các module không reference lẫn nhau, chỉ giao tiếp qua Interface tại BuildingBlocks.</text>
    </g>
  </g>


  <!-- =================================================== -->
  <!-- RIGHT PANEL: CƠ CHẾ 2 - BẤT ĐỒNG BỘ & DOMAIN EVENT  -->
  <!-- =================================================== -->
  <g transform="translate(735, 95)" filter="url(#shadow)">
    <!-- Container -->
    <rect width="430" height="625" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8" />
    
    <!-- Header -->
    <rect width="430" height="42" rx="14" fill="#f5f3ff" />
    <path d="M 0 26 L 0 42 L 430 42 L 430 26 Z" fill="#f5f3ff" />
    <line x1="0" y1="42" x2="430" y2="42" stroke="#ddd6fe" stroke-width="1" />
    <text x="215" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">
      CƠ CHẾ 2: BẤT ĐỒNG BỘ QUA DOMAIN EVENT BUS
    </text>

    <!-- Step 1: Publisher -->
    <g transform="translate(25, 55)">
      <rect width="380" height="60" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1.2" />
      <text x="190" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#581c87">
        1. Aggregate Root Phát Sự Kiện
      </text>
      <text x="190" y="42" text-anchor="middle" font-size="11" fill="#6b21a8">
        Order.Cancel() ➔ AddDomainEvent(new OrderCancelled(...))
      </text>
      <text x="190" y="54" text-anchor="middle" font-size="9.5" fill="#7e22ce">
        (Chỉ phát sau khi lưu trạng thái CANCELLED vào CSDL)
      </text>
    </g>
    <path d="M 215 115 L 215 135" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowPurple)" fill="none" />

    <!-- Step 2: Event Definition -->
    <g transform="translate(25, 137)">
      <rect width="380" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" />
      <text x="190" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">
        2. Sự Kiện Miền (BuildingBlocks.Contracts)
      </text>
      <text x="190" y="40" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">
        record OrderCancelled(...) : IDomainEvent, INotification
      </text>
    </g>
    <path d="M 215 189 L 215 209" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowPurple)" fill="none" />

    <!-- Step 3: Event Bus Engine -->
    <g transform="translate(25, 211)">
      <rect width="380" height="68" rx="10" fill="#7c3aed" />
      <text x="190" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">
        3. InMemoryEventBus (Nền tảng MediatR)
      </text>
      <text x="190" y="48" text-anchor="middle" font-size="11" fill="#ede9fe">
        DomainEventDispatcher.DispatchAsync()
      </text>
      <text x="190" y="60" text-anchor="middle" font-size="9.5" fill="#ddd6fe">
        Tự động định tuyến tới tất cả các Subscriber đăng ký
      </text>
    </g>
    <path d="M 215 279 L 215 301" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowPurple)" fill="none" />

    <!-- Step 4: Subscriber Handler -->
    <g transform="translate(25, 303)">
      <rect width="380" height="70" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1.2" />
      <text x="190" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#581c87">
        4. Module Inventory Xử Lý Sự Kiện
      </text>
      <text x="190" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">
        OrderCancelledHandler : INotificationHandler&lt;OrderCancelled&gt;
      </text>
      <text x="190" y="58" text-anchor="middle" font-size="10.5" fill="#059669">
        ➔ Gọi RestoreStockAsync() hoàn tồn kho
      </text>
    </g>

    <!-- Future extension block (Loose Coupling proof) -->
    <g transform="translate(25, 385)">
      <rect width="380" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3" />
      <text x="190" y="20" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748b">
        MỞ RỘNG TRONG TƯƠNG LAI (OPEN/CLOSED PRINCIPLE)
      </text>
      <text x="190" y="40" text-anchor="middle" font-size="10" fill="#475569">
        + Gửi Email xin lỗi: EmailNotificationHandler
      </text>
      <text x="190" y="56" text-anchor="middle" font-size="10" fill="#475569">
        + Hoàn điểm tích lũy: LoyaltyPointsRefundHandler
      </text>
      <text x="190" y="70" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0284c7">
        (Hoàn toàn không sửa một dòng code nào trong Module Order)
      </text>
    </g>

    <!-- Footer Summary of Mech 2 -->
    <g transform="translate(25, 485)">
      <rect width="380" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="15" y="25" font-size="12" font-weight="700" fill="#0f172a">Đặc điểm kỹ thuật chính của Cơ chế 2:</text>
      <text x="15" y="47" font-size="11" fill="#334155">• Hình thức: Publish / Subscribe (Phát - Nhận), bất đồng bộ.</text>
      <text x="15" y="67" font-size="11" fill="#334155">• Mục đích: Xử lý tác vụ phụ sau khi giao dịch chính đã cam kết.</text>
      <text x="15" y="87" font-size="11" fill="#334155">• Liên kết: Lỏng hoàn toàn (Order không biết Inventory tồn tại).</text>
      <text x="15" y="107" font-size="11" fill="#334155">• Thay thế: Dễ dàng đổi sang RabbitMQ/Kafka mà không sửa code.</text>
    </g>
  </g>

</svg>

